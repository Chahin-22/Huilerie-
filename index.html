<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oued Lakhdar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3E4A1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Reçus — Huilerie Oued Lakhdar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#3E4A1F; --gold:#B8911C; --paper:#EDEFE4; --card:#FFFFFF;
  --ink:#1E2414; --muted:#6B7058; --line:#D5D9C6; --danger:#A33A2A; --ticket:#FFFEF8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --olive:#A9BC6A; --gold:#D9B545; --paper:#161A10; --card:#20261A;
    --ink:#EEF0E4; --muted:#A3A890; --line:#343C2A; --danger:#E0715F;
  }
}
:root[data-theme="dark"]{
  --olive:#A9BC6A; --gold:#D9B545; --paper:#161A10; --card:#20261A;
  --ink:#EEF0E4; --muted:#A3A890; --line:#343C2A; --danger:#E0715F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Alegreya Sans",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;gap:14px;padding:8px 0 16px;border-bottom:2px solid var(--olive)}
header.top h1{font:700 1.45rem/1.1 Alegreya,Georgia,serif;margin:0;color:var(--olive)}
.logo-tile{flex:0 0 74px;height:80px;border-radius:14px;background:#3E4A1F;display:grid;place-items:center;padding:6px}
.logo-tile img{max-width:100%;max-height:100%;display:block}
.ticket .hd .lg{display:block;width:120px;max-width:45%;margin:0 auto 8px}
header.top small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
h2{font:700 1.15rem Alegreya,Georgia,serif;margin:22px 0 10px}
section[hidden],.form[hidden]{display:none}
.field{margin-bottom:12px}
label{display:block;font-weight:500;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--olive);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--olive);padding:12px 8px;font:500 .95rem "Alegreya Sans",sans-serif;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--paper)}
.seg button span{display:block;font-size:.8rem;opacity:.8}
.seg.big button{font:700 1.02rem "Alegreya Sans",sans-serif;padding:13px 8px}
.calc{background:var(--card);border-left:4px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;margin:16px 0}
.calc div{display:flex;justify-content:space-between;padding:3px 0}
.calc div.big{font-weight:700;font-size:1.1rem;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:700 1.05rem "Alegreya Sans",sans-serif;background:var(--olive);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--olive);border:1px solid var(--olive)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn[hidden]{display:none}
.btns{display:grid;gap:10px;margin-top:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font:500 .85rem "Alegreya Sans",sans-serif;color:var(--muted)}
nav.tabs button svg{display:block;margin:0 auto 3px;width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--olive)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:var(--card);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:700 1.15rem Alegreya,serif;color:var(--olive)}
.stat span{font-size:.82rem;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.list li .n{font-weight:700}
.list li .s{font-size:.85rem;color:var(--muted)}
.list li .r{text-align:right;white-space:nowrap}
.list li .due{color:var(--danger)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.t{background:var(--olive);color:var(--paper)}
.tag.v{background:var(--gold);color:#1E2414}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}
#tRateBox[hidden]{display:none}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;min-height:50px;text-align:left}
.field{min-width:0}
.chips button{border:1px solid var(--olive);background:var(--card);color:var(--olive);border-radius:10px;padding:12px 4px;font:700 1rem "Alegreya Sans",sans-serif}
.chips button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1E2414}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.overlay{position:fixed;inset:0;background:rgba(20,24,12,.72);z-index:10;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay[hidden]{display:none}
.ticket{max-width:380px;margin:0 auto;background:var(--ticket);color:#1E2414;padding:22px 20px 18px;
  -webkit-mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/18px 51% repeat-x;
  mask:radial-gradient(circle 7px at 50% 0,transparent 98%,#000) 0 0/18px 51% repeat-x,radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/18px 51% repeat-x}
.ticket .hd{text-align:center;border-bottom:1.5px solid #1E2414;padding-bottom:10px}
.ticket .hd .co{font:700 1.15rem/1.15 Alegreya,serif}
.ticket .hd .ar{font:500 .95rem "Noto Kufi Arabic",sans-serif;direction:rtl;margin:4px 0}
.ticket .hd .ad{font-size:.82rem;color:#4a513a}
.ticket .tt{text-align:center;font:700 1rem Alegreya,serif;margin:10px 0 4px}
.ticket .meta{display:flex;justify-content:space-between;font-size:.85rem;color:#4a513a;border-bottom:1px dashed #9aa085;padding-bottom:8px}
.ticket dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.95rem}
.ticket dt{color:#4a513a}
.ticket dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.ticket .sep{border-top:1px dashed #9aa085;margin:6px 0}
.ticket .total{display:flex;justify-content:space-between;font:700 1.15rem Alegreya,serif;border-top:1.5px solid #1E2414;border-bottom:1.5px solid #1E2414;padding:8px 0;margin-top:6px}
.ticket .sig{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:.8rem;color:#4a513a;text-align:center}
.ticket .sig div{border-top:1px solid #9aa085;padding-top:4px;margin-top:40px}
.ticket .ft{text-align:center;font-size:.78rem;color:#4a513a;margin-top:14px}
.ticket-actions{max-width:380px;margin:14px auto 0;display:grid;gap:8px}
.ticket-actions .btn.ghost{background:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:.95rem;z-index:20;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
/* 80 mm thermal printing */
@media print{
  @page{size:80mm auto;margin:2mm}
  html,body{background:#fff!important;padding:0!important}
  .wrap,nav.tabs,.ticket-actions,.toast{display:none!important}
  .overlay{position:static!important;background:none!important;padding:0!important;overflow:visible}
  .ticket{-webkit-mask:none!important;mask:none!important;width:74mm;max-width:none;margin:0;padding:0;background:#fff;color:#000;font-size:12px;animation:none!important}
  .ticket *{color:#000!important;border-color:#000!important}
  .ticket dl{font-size:12px}
  .ticket .hd .co{font-size:15px}
  .ticket .hd .lg{width:34mm}
}
@media (prefers-reduced-motion:no-preference){.ticket{animation:feed .35s ease-out}@keyframes feed{from{transform:translateY(-14px);opacity:0}}}
</style>
</head>

  <section id="tab-new">
    <h2>Nouveau reçu</h2>
    <div class="seg big" role="group" aria-label="Type de reçu">
      <button type="button" id="typeT" aria-pressed="true">Trituration</button>
      <button type="button" id="typeV" aria-pressed="false">Vente d'huile</button>
    </div>

    <div class="field" style="margin-top:14px"><label for="client">Nom du client</label><input id="client" autocomplete="off" placeholder="ex. Benali Ahmed"></div>
    <div class="row">
      <div class="field"><label for="phone">Téléphone</label><input id="phone" type="tel" inputmode="tel" placeholder="05…"></div>
      <div class="field"><label for="date">Date</label><input id="date" type="date"></div>
    </div>

    <!-- Trituration -->
    <div class="form" id="formT">
      <div class="row">
        <div class="field"><label for="olives">Olives reçues (kg)</label><input id="olives" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
        <div class="field"><label for="oil">Huile obtenue (kg)</label><input id="oil" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      </div>
      <div class="row">
        <div class="field"><label for="variety">Variété / origine</label><input id="variety" placeholder="ex. Chemlal, Sigoise"></div>
        <div class="field"><label for="bidonsT">Bidons remis</label><input id="bidonsT" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      </div>
      <label>Mode de paiement</label>
      <div class="seg" role="group" aria-label="Mode de paiement">
        <button type="button" id="payCash" aria-pressed="true">Espèces<span id="lblCash"></span></button>
        <button type="button" id="payKind" aria-pressed="false">En nature<span id="lblKind"></span></button>
      </div>
      <div id="tRateBox">
        <label style="margin-top:14px">Tarif trituration (DA / quintal)</label>
        <div class="chips" id="chipsT" role="group" aria-label="Tarif trituration"></div>
      </div>
    </div>

    <!-- Vente -->
    <div class="form" id="formV" hidden>
      <label>Produit</label>
      <div class="seg" role="group" aria-label="Qualité" id="qualSeg">
        <button type="button" data-q="Extra vierge" aria-pressed="true">Huile d'olive<span>Extra vierge</span></button>
        <button type="button" data-q="Vierge" aria-pressed="false">Huile d'olive<span>Vierge</span></button>
      </div>
      <label style="margin-top:14px">Prix</label>
      <div class="chips" id="chips" role="group" aria-label="Prix"></div>
      <div class="row" style="margin-top:10px">
        <div class="field"><label for="price" id="lblPrice">Autre prix (DA / L)</label><input id="price" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="unit">Unité</label><select id="unit"><option value="L">Litre</option><option value="kg">Kilogramme</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label for="qty" id="lblQty">Quantité (L)</label><input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
        <div class="field"><label for="bidonsV">Nombre de bidons</label><input id="bidonsV" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      </div>
      <div class="row">
        <div class="field"><label for="pack">Emballage (DA)</label><input id="pack" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>

  function wrapText(ctx,t,maxW){
    const words=String(t||"").split(/\s+/), lines=[]; let cur="";
    words.forEach(w=>{ const test=cur?cur+" "+w:w; if(ctx.measureText(test).width<=maxW||!cur) cur=test; else { lines.push(cur); cur=w; } });
    if(cur) lines.push(cur); return lines.length?lines:[""];
  }
  function drawLabel(ctx,B,x0,cw,draw){
    let y=0; const body="30px 'Alegreya Sans', sans-serif", bodyB="500 30px 'Alegreya Sans', sans-serif", LH=40;
    ctx.fillStyle="#000"; ctx.strokeStyle="#000"; ctx.textBaseline="alphabetic";
    const line=(yy,w,dash)=>{ if(!draw) return; ctx.lineWidth=w; ctx.setLineDash(dash?[10,8]:[]); ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x0+cw,yy); ctx.stroke(); ctx.setLineDash([]); };
    B.forEach(b=>{
      if(b.k==="logo"){ if(logoImg.complete&&logoImg.naturalWidth){ const w=26*DPMM, h=w*logoImg.naturalHeight/logoImg.naturalWidth; if(draw) ctx.drawImage(logoImg,x0+(cw-w)/2,y,w,h); y+=h+10; } }
      else if(b.k==="text"){ y+=b.pad||0; ctx.font=b.f; const size=parseInt(b.f.match(/(\d+)px/)[1]); ctx.direction=b.rtl?"rtl":"ltr";
        wrapText(ctx,b.t,cw).forEach(l=>{ y+=size*1.3; if(draw){ ctx.textAlign=b.a; ctx.fillText(l,b.a==="center"?x0+cw/2:(b.a==="right"?x0+cw:x0),y-size*0.28); } });
        ctx.direction="ltr"; }
      else if(b.k==="rule"){ y+=10; line(y,b.w); y+=6; }
      else if(b.k==="sep"){ y+=10; line(y,2,true); y+=6; }
      else if(b.k==="meta"||b.k==="row"){ ctx.font=body; const lw=ctx.measureText(b.l).width; ctx.font=bodyB; const vw=ctx.measureText(b.v).width;
        if(lw+vw+24<=cw){ y+=LH; if(draw){ ctx.font=body; ctx.textAlign="left"; ctx.fillText(b.l,x0,y-10); ctx.font=bodyB; ctx.textAlign="right"; ctx.fillText(b.v,x0+cw,y-10); } }
        else { y+=LH; if(draw){ ctx.font=body; ctx.textAlign="left"; ctx.fillText(b.l,x0,y-10); } ctx.font=bodyB;
          wrapText(ctx,b.v,cw-40).forEach(l=>{ y+=LH; if(draw){ ctx.textAlign="right"; ctx.fillText(l,x0+cw,y-10); } }); } }
      else if(b.k==="total"){ y+=12; line(y,3); y+=58; if(draw){ ctx.font="700 42px Alegreya, Georgia, serif"; ctx.textAlign="left"; ctx.fillText(b.l,x0,y-16); ctx.textAlign="right"; ctx.fillText(b.v,x0+cw,y-16); } line(y,3); y+=6; }
      else if(b.k==="sig"){ y+=110; const half=(cw-40)/2; if(draw){ ctx.lineWidth=2; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0+half,y); ctx.moveTo(x0+half+40,y); ctx.lineTo(x0+cw,y); ctx.stroke();
          ctx.font="26px 'Alegreya Sans', sans-serif"; ctx.textAlign="center"; ctx.fillText("Signature client",x0+half/2,y+32); ctx.fillText("Cachet huilerie",x0+half+40+half/2,y+32); } y+=40; }
    });
    return y;
  }

    const W=Math.round((S.lw||100)*DPMM), H=Math.round((S.lh||150)*DPMM), M=3*DPMM, cw=W-2*M;
    const c=document.createElement("canvas"); c.width=W; c.height=H; const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    const B=labelBlocks(r), need=drawLabel(ctx,B,0,cw,false);
    const s=Math.min(1,(H-2*M)/need);
    ctx.save(); ctx.translate(M+(cw-cw*s)/2,M); ctx.scale(s,s); drawLabel(ctx,B,0,cw,true); ctx.restore();
    const blob=await new Promise(res=>c.toBlob(res,"image/png"));
    return new File([blob],"recu-"+r.no+".png",{type:"image/png"});
  }
  let labelP=null, labelFor=null;
  function prepLabel(r){ labelFor=r.id; labelP=makeLabel(r).catch(()=>null); }
  $("labelBtn").onclick=async()=>{
    if(!current) return;
    if(labelFor!==current.id) prepLabel(current);
    const file=await labelP; if(!file){ toast("Création de l'étiquette impossible sur cet appareil"); return; }
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"Reçu "+current.no}); return; }
      catch(e){ if(e.name==="AbortError") return; }
    }
    const a=document.createElement("a"), u=URL.createObjectURL(file); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast("Image enregistrée : ouvrez-la dans Munbyn Print pour imprimer");
  };
  $("delBtn").onclick=()=>{
    if(!current || !confirm("Supprimer le reçu N° "+current.no+" ?")) return;
    R=R.filter(x=>x.id!==current.id); save("hol_receipts",R);
    $("overlay").hidden=true; current=null; renderHist(); toast("Reçu supprimé");
  };

  function filtered(){
    const d=$("fDate").value, q=$("fSearch").value.trim().toLowerCase();
    return R.filter(r=>(fType==="all"||r.type===fType)&&(!d||r.date===d)&&(!q||r.client.toLowerCase().includes(q)||r.no.toLowerCase().includes(q)));
  }
  function renderHist(){
    const f=filtered(), T=f.filter(r=>r.type==="T"), V=f.filter(r=>r.type==="V");
    $("sOlives").textContent=kg(T.reduce((a,r)=>a+r.olives,0));
    $("sCash").textContent=da(T.filter(r=>r.mode==="cash").reduce((a,r)=>a+r.fee,0));
    $("sKind").textContent=kg(r2(T.filter(r=>r.mode==="kind").reduce((a,r)=>a+r.fee,0)));
    { const L=r2(V.filter(r=>U(r.unit)==="L").reduce((a,r)=>a+r.qty,0)), K=r2(V.filter(r=>U(r.unit)==="kg").reduce((a,r)=>a+r.qty,0));
      $("sSold").textContent=[L?qtyTxt(L,"L"):"",K?qtyTxt(K,"kg"):""].filter(Boolean).join(" + ")||"0 L"; }
    $("sSales").textContent=da(V.reduce((a,r)=>a+r.total,0));
    $("sDue").textContent=da(V.reduce((a,r)=>a+r.due,0));
    const ul=$("list");
    if(!f.length){ ul.innerHTML=`<li class="empty" style="display:block;cursor:default">Aucun reçu pour cette sélection. Créez-en un depuis l'onglet Nouveau.</li>`; return; }
    ul.innerHTML=f.map(r=>`<li data-id="${r.id}"><div><div class="n"><span class="tag ${r.type==="V"?"v":"t"}">${r.type==="V"?"Vente":"Trit."}</span>${esc(r.client)}</div>
      <div class="s">N° ${esc(r.no)} · ${fmtDate(r.date)}</div></div>
      <div class="r">${r.type==="V"
        ? `<div class="n">${da(r.total)}</div><div class="s ${r.due?"due":""}">${r.due?"Reste "+da(r.due):qtyTxt(r.qty,r.unit)}</div>`
        : `<div class="n">${kg(r.olives)}</div><div class="s">${r.mode==="cash"?da(r.fee):kg(r.fee)+" huile"}</div>`}</div></li>`).join("");
    ul.querySelectorAll("li[data-id]").forEach(li=>li.onclick=()=>showTicket(R.find(x=>x.id===li.dataset.id)));
  }
  $("fType").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    fType=b.dataset.f; $("fType").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderHist();
  });
  $("fDate").addEventListener("input",renderHist); $("fSearch").addEventListener("input",renderHist);

  $("csvBtn").onclick=async()=>{
    const f=filtered(); if(!f.length){ toast("Rien à copier"); return; }
    const head=["Type","N°","Date","Heure","Client","Téléphone","Olives kg","Huile obtenue kg","Paiement trituration","Frais trituration","Huile remise kg","Huile vendue","Unité","Prix DA/unité","Total vente DA","Versé DA","Reste DA","Bidons","Observations"];
    const rows=f.map(r=>(r.type==="V"
      ? ["Vente",r.no,fmtDate(r.date),r.time,r.client,r.phone,"","","","","",r.qty,U(r.unit),r.price,r.total,r.paid,r.due,r.bidons,r.notes]
      : ["Trituration",r.no,fmtDate(r.date),r.time,r.client,r.phone,r.olives,r.oil,r.mode==="cash"?"Espèces (DA)":"Nature (kg)",r.fee,r.net,"","","","","","",r.bidons,r.notes]
    ).map(v=>String(v??"").replace(/\t|\n/g," ")).join("\t"));
    try{ await navigator.clipboard.writeText([head.join("\t"),...rows].join("\n")); toast("Copié — collez dans Excel ou Numbers"); }
    catch(e){ toast("Copie impossible sur cet appareil"); }
  };

  function loadSettingsForm(){
    $("sName").value=S.name; $("sAddr").value=S.addr; $("sPhones").value=S.phones; $("sRC").value=S.rc; $("sNIF").value=S.nif;
    $("sTRates").value=S.tRates.join(", "); $("sKindRate").value=S.kindRate; $("sPrices").value=S.prices.join(", "); $("sSeason").value=S.season;
    $("sNextT").value=S.next; $("sEmail").value=S.email||""; $("sHook").value=S.hook||""; showQueue(); $("sNextV").value=S.nextV; $("sLW").value=S.lw; $("sLH").value=S.lh;
  }
  $("saveSet").onclick=()=>{
    S.name=$("sName").value.trim()||DEF.name; S.addr=$("sAddr").value.trim(); S.phones=$("sPhones").value.trim();
    S.rc=$("sRC").value.trim(); S.nif=$("sNIF").value.trim();
    S.tRates=$("sTRates").value.split(/[,;\s]+/).map(Number).filter(v=>v>0).slice(0,8); if(!S.tRates.length) S.tRates=DEF.tRates.slice(); if(!S.tRates.includes(tRate)) tRate=S.tRates.includes(1000)?1000:S.tRates[0]; S.cashRate=tRate; S.kindRate=parseFloat($("sKindRate").value)||DEF.kindRate;
    S.prices=$("sPrices").value.split(/[,;\s]+/).map(Number).filter(v=>v>0).slice(0,8); if(!S.prices.length) S.prices=DEF.prices.slice(); S.season=$("sSeason").value.trim();
    S.next=Math.max(1,parseInt($("sNextT").value)||1); S.email=$("sEmail").value.trim(); S.hook=$("sHook").value.trim(); flushQueue(); S.nextV=Math.max(1,parseInt($("sNextV").value)||1);
    S.lw=Math.min(110,Math.max(30,parseFloat($("sLW").value)||100)); S.lh=Math.min(300,Math.max(30,parseFloat($("sLH").value)||150));
    save("hol_settings",S); $("price").value=""; applyHeader(); refreshCalc(); toast("Réglages enregistrés");
  };
  $("cloudAll").onclick=()=>{
    if(!S.hook){ toast("Collez d'abord le lien du script Google, puis enregistrez"); return; }
    if(!R.length){ toast("Aucun reçu à envoyer"); return; }
    if(!confirm("Envoyer les "+R.length+" reçus vers Google Sheets ? (sans e-mail, les doublons sont ignorés)")) return;
    const queued=new Set(Q.map(m=>m.id));
    R.slice().reverse().forEach(r=>{ if(!queued.has(r.id)) queueMail(r,true); });
    flushQueue(); toast("Envoi en cours…");
  };
  $("wipe").onclick=()=>{
    if(!confirm("Effacer définitivement les "+R.length+" reçus ?")) return;
    R=[]; save("hol_receipts",R); renderHist(); toast("Historique effacé");
  };

  document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("nav.tabs button").forEach(x=>x.removeAttribute("aria-current"));
    b.setAttribute("aria-current","page");
    ["new","hist","set"].forEach(t=>$("tab-"+t).hidden=t!==b.dataset.tab);
    if(b.dataset.tab==="hist") renderHist();
    if(b.dataset.tab==="set") loadSettingsForm();
    window.scrollTo(0,0);
  });

  $("date").value=today(); $("fDate").value=today();
  applyHeader(); setType("T"); flushQueue();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
